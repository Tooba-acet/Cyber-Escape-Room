<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an office floor plan on blueprint paper; each room is a colour-coded door that unlocks one digit of the vault code. Single bright theme by choice. */
:root{
  color-scheme: light;
  --paper:#EAF0FF; --grid:#D3DDF7; --card:#FFFFFF; --ink:#16204A; --muted:#55608A;
  --coral:#FF5E3A; --teal:#0FA89A; --mustard:#F2B300; --violet:#7650F0; --cobalt:#2456E8;
  --good:#11865B; --goodbg:#DDF6EA; --bad:#C8321B; --badbg:#FFE3DC;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:4px 4px 0 var(--ink);
  --room:var(--cobalt);
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.brand .lock{width:30px;height:30px;border:3px solid var(--ink);border-radius:8px;background:var(--mustard);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:var(--card);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:13px;font-weight:700;border:2px solid var(--ink);background:var(--card);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums}
.chip.t{background:var(--mustard)}

/* Panels */
.panel{background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:3px solid var(--ink);background:var(--room);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.big{font-size:18px;padding:13px 24px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Intro */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:stretch}
.hero h1{font-family:var(--display);font-size:clamp(30px,6vw,52px);line-height:1.02;margin:8px 0 12px;color:var(--ink)}
.hero h1 span{color:var(--coral)}
.alarm{background:var(--ink);color:#fff;border-radius:14px;border:3px solid var(--ink);box-shadow:var(--shadow);padding:18px;font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;gap:6px}
.alarm .blink{color:var(--mustard);font-weight:700}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.rule{border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--card)}
.rule b{font-family:var(--mono);font-size:20px;display:block}
.doors{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.door{border:3px solid var(--ink);border-radius:12px 12px 4px 4px;padding:12px 10px;background:var(--c);color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:3px 3px 0 var(--ink);text-align:left}
.door.ink{color:var(--ink)}
.door .num{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.9}
.door h3{font-family:var(--display);font-size:15px;line-height:1.1;font-weight:400}
.door .topic{font-size:13px;line-height:1.3}
.door{padding-right:26px}
.door .knob{position:absolute;right:10px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid #fff}
.door.locked{filter:saturate(.25) brightness(1.05);opacity:.75}
.door .state{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(0,0,0,.22);border-radius:6px;padding:2px 6px;align-self:flex-start}
.door.ink .state{background:rgba(255,255,255,.55)}
.door.done .state{background:#fff;color:var(--ink)}

/* Puzzle screen */
.roomhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-bottom:3px dashed var(--room);padding-bottom:12px;margin-bottom:16px}
.roomhead h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--room)}
.pips{display:flex;gap:6px}
.pip{width:26px;height:10px;border-radius:5px;border:2px solid var(--ink);background:var(--card)}
.pip.on{background:var(--room)}
.pip.cur{background:repeating-linear-gradient(45deg,var(--room) 0 4px,var(--card) 4px 8px)}
.prompt{font-size:19px;font-weight:700;margin:4px 0 14px;max-width:70ch}
.story{background:var(--paper);border-left:6px solid var(--room);border-radius:8px;padding:12px 14px;margin-bottom:14px;max-width:75ch}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){background:var(--paper)}
.opt .k{font-family:var(--mono);font-weight:700;border:2px solid var(--ink);border-radius:6px;min-width:28px;height:28px;display:grid;place-items:center;font-size:13px;flex:none}
.opt.sel{background:#E4EBFF;border-color:var(--cobalt)}
.opt.sel .k{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.opt.ok{background:var(--goodbg);border-color:var(--good)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:14px;margin-top:4px;display:block}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;border:2px solid var(--ink);font-size:15px}
.fb.ok{background:var(--goodbg);border-color:var(--good)}
.fb.no{background:var(--badbg);border-color:var(--bad)}
.fb.hint{background:#FFF4CC;border-color:var(--mustard)}
.fb b{display:block;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px}
.cost{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* Email hotspot */
.mail{border:2px solid var(--ink);border-radius:12px;overflow:hidden;max-width:680px;background:#fff}
.mail .bar{background:#F1F3F9;border-bottom:2px solid var(--ink);padding:10px 14px;display:grid;gap:4px;font-size:14px}
.mail .body{padding:14px;display:grid;gap:10px;font-size:15px}
.spot{border:2px dashed transparent;background:transparent;border-radius:6px;padding:1px 4px;text-align:left;font:inherit;display:inline}
.spot:hover:not(:disabled){border-color:var(--cobalt);background:#EEF2FF}
.spot.found{background:var(--badbg);border:2px solid var(--bad)}
.spot.safe{background:#F2F2F2;border:2px solid #B8BCCB;color:var(--muted)}
.cta{display:inline-block;background:#0B63CE;color:#fff;padding:8px 14px;border-radius:6px;font-weight:700}
.found-list{margin:12px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.counter{font-family:var(--mono);font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}

/* Desk scene */
.desk{position:relative;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#C99A6B,#B9855A);aspect-ratio:16/9;max-width:100%;overflow:hidden}
.desk .wall{position:absolute;inset:0 0 58% 0;background:#DCE6FB;border-bottom:3px solid var(--ink)}
.item{position:absolute;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:clamp(9px,1.6vw,13px);line-height:1.15;padding:4px 6px;font-weight:700;text-align:center;display:grid;place-items:center;box-shadow:2px 2px 0 rgba(22,32,74,.5)}
.item:hover:not(:disabled){outline:3px solid var(--cobalt)}
.item.found{outline:3px solid var(--bad);background:var(--badbg)}
.item.safe{opacity:.55}
.item .tag{display:block;font-family:var(--mono);font-size:.85em;font-weight:500}

/* Assign / order */
.cards{display:grid;gap:10px}
.card{border:2px solid var(--ink);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card)}
.card.no{background:var(--badbg);border-color:var(--bad)}
.card.ok{background:var(--goodbg);border-color:var(--good)}
.card .txt{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.seg button{border:2px solid var(--ink);background:var(--card);border-radius:8px;padding:5px 10px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--room);color:#fff}
.ord{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.ord .n{font-family:var(--display);font-size:22px;color:var(--room);width:30px;text-align:center}
.ord .mv{display:flex;gap:4px}
.ord .mv button{border:2px solid var(--ink);background:var(--card);border-radius:6px;width:34px;height:34px;font-weight:700}
.pw{font-family:var(--mono);font-weight:700;font-size:16px;word-break:break-all}

/* Lightning + keypad */
.lt{display:grid;gap:14px;justify-items:center;text-align:center}
.lt .q{font-size:22px;font-weight:700;max-width:34ch}
.meter{width:100%;max-width:520px;height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--card)}
.meter i{display:block;height:100%;background:var(--coral);transition:width .2s linear}
.tf{display:flex;gap:12px}
.tf .btn{min-width:130px}
.vault{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.dots{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.digits{display:flex;gap:8px;margin-bottom:12px}
.digits span{width:52px;height:62px;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:28px;font-weight:700;background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keys button{height:54px;border:3px solid var(--ink);border-radius:10px;background:var(--card);font-family:var(--mono);font-size:20px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.keys button:active{transform:translate(2px,2px);box-shadow:none}
.collected{display:grid;gap:6px}
.collected div{display:flex;gap:10px;align-items:center;font-size:15px}
.collected i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.collected b{font-family:var(--mono);font-size:18px}

/* Room complete + results */
.digitbig{font-family:var(--display);font-size:96px;line-height:1;color:var(--room);text-shadow:4px 4px 0 var(--ink);margin:8px 0}
.lesson{background:var(--paper);border-radius:10px;padding:12px 14px;border:2px solid var(--ink);max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--card)}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.score{font-family:var(--display);font-size:clamp(48px,10vw,84px);line-height:1;color:var(--coral);text-shadow:4px 4px 0 var(--ink)}
.tooba{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;max-width:72ch}
.tooba .av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--violet);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.tooba .who{font-weight:700;font-size:14px}
.tooba .role{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tooba p{margin:4px 0 0}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:14px}
.field input{font:inherit;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;max-width:420px}
.field .err{color:var(--bad);font-size:13px}
.notice{border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;background:#FFF4CC;font-size:14px}

/* Tables */
.tablewrap{overflow-x:auto;border:2px solid var(--ink);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;background:#F3F6FF;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tr.me td{background:#FFF4CC}
.who{display:flex;gap:8px;align-items:center}
.who img{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink)}
.medal{font-family:var(--display);font-size:16px;width:28px;display:inline-block}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.bartrack{height:18px;border:2px solid var(--ink);border-radius:6px;background:var(--card);overflow:hidden}
.bartrack i{display:block;height:100%}
.empty{padding:28px;text-align:center;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(560px,calc(100% - 32px));z-index:60;box-shadow:3px 3px 0 var(--coral)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:.4}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}.btn{transition:none}}

@media (max-width:760px){
  .hero,.vault{grid-template-columns:1fr}
  .rules,.stats{grid-template-columns:repeat(2,1fr)}
  .doors{grid-template-columns:repeat(2,1fr)}
  .card{grid-template-columns:1fr}
  .seg{justify-content:flex-start}
  .barrow{grid-template-columns:1fr 70px}
  .barrow .bartrack{grid-column:1/-1;grid-row:2}
  .panel{padding:16px}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="lock" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="7" width="12" height="8" rx="2" fill="#16204A"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#16204A" stroke-width="2" fill="none"/></svg></span>Cyber Escape Room</div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-play" aria-selected="true">Play</button>
      <button class="tab" role="tab" id="tab-board" aria-selected="false">Leaderboard</button>
      <button class="tab" role="tab" id="tab-admin" aria-selected="false" hidden>Team results</button>
    </nav>
    <div class="hud" id="hud" hidden>
      <span class="chip t" id="hud-time">00:00</span>
      <span class="chip" id="hud-score">0 pts</span>
      <button class="chip" id="hud-sound" aria-pressed="true" title="Sound on or off">Sound: on</button>
    </div>
  </header>
  <main id="stage"></main>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* =========================== CONTENT =========================== */
const ROOMS = [
 { id:"bd", name:"Reception", short:"Reception", guide:"Reception handles more outside calls, visitors and email than anyone else, and that is where the attack started. Find out how the attackers got in.", topic:"Phishing & social engineering", color:"#FF5E3A", ink:false, digit:7,
   intro:"The alarm started here. Someone opened a message they shouldn't have. Find out how the attackers got in.",
   lesson:"Slow down when a message pushes urgency, secrecy, or a login. Verify through a channel you already trust, such as the intranet phone list, and report anything suspicious.",
   puzzles:[
   { type:"hotspot-mail", prompt:"This email reached 40 inboxes this morning. Click every red flag in it.",
     hint:"Check who sent it, where the button really goes, and the full file name of the attachment.",
     spots:{
       from:{bad:true, why:"The sender domain is micros0ft-helpdesk.co, with a zero in place of the letter o. Real Microsoft mail does not come from look-alike domains."},
       subject:{bad:true, why:"A countdown threat (\"deleted in 2 hours\") is designed to make you act before you think."},
       greet:{bad:true, why:"\"Dear user\" is a generic greeting. Services you use normally address you by name."},
       link:{bad:true, why:"The button text says Microsoft, but the link goes to login-secure.ru. Hover over links before clicking to see the real destination."},
       attach:{bad:true, why:"Mailbox_Report.pdf.exe is a program disguised as a PDF. A double extension ending in .exe will run code on your computer."},
       to:{bad:false, why:"Your own address in the To line is normal."},
       date:{bad:false, why:"A weekday morning timestamp is normal."},
       sign:{bad:false, why:"A sign-off alone is not a red flag."}
     }},
   { type:"assign", prompt:"Five messages arrived during the attack. Label each one Phish or Legit.", labels:["Phish","Legit"],
     hint:"Look for pressure, secrecy, payment requests, and anything that arrives outside a channel you already use.",
     items:[
       {t:"A sticker with a QR code is stuck over the car park sign: \"Scan to validate free parking.\"", a:"Phish", why:"QR phishing (\"quishing\") hides a malicious link behind a code you cannot read. Stickers placed over official signs are a known trick."},
       {t:"A voice note from the CEO: \"I'm in a meeting, buy five gift cards for a client and send me the codes. Keep this between us.\"", a:"Phish", why:"Gift cards plus secrecy is classic CEO fraud. Voices can be cloned from a few seconds of public audio, so verify by calling back on a known number."},
       {t:"A teammate shares the slide deck you asked for, inside your existing project channel.", a:"Legit", why:"Expected content, from a known colleague, in a channel you already use."},
       {t:"SMS: \"Your parcel is on hold. Pay a 1.99 customs fee at dhl-redelivery-pay.com.\"", a:"Phish", why:"Smishing uses small payments to collect card details. Courier fees are paid on the courier's official site or app."},
       {t:"Tooba sends a calendar invite for this year's security awareness training through the usual Outlook calendar. It asks for nothing.", a:"Legit", why:"It comes from a known colleague through the normal system, and asks for no credentials, payment, or files."}
     ]},
   { type:"choice", story:"Your desk phone rings. \"Hi, I'm calling from the IT helpdesk. We're migrating your account and I've just sent a code to your phone. Read it back to me so I can finish.\"",
     prompt:"What do you do?", hint:"Who should ever see a one-time code besides you?",
     options:[
       {t:"Read the code out. The caller knows about the migration, so it must be real.", ok:false, why:"Knowing internal details proves nothing; that information is easy to gather. IT never needs your one-time code."},
       {t:"Ask the caller to email the request instead.", ok:false, why:"Email can be spoofed too. Verify through a channel you choose, not one the caller offers."},
       {t:"Hang up, call IT on the number from the intranet, and report the call.", ok:true, why:"A one-time code is for you alone. Calling back on a number you already trust beats any pretext, and the report lets security warn others."},
       {t:"Read out an old code to test whether the caller is genuine.", ok:false, why:"Engaging with the caller gives them more time and information. End the call and report it."}
     ]}
   ]},
 { id:"it", name:"IT Room", short:"IT", guide:"The attackers are now trying to sign in to our systems with stolen passwords. Lock the accounts down before they get further.", topic:"Passwords & MFA", color:"#0FA89A", ink:false, digit:3,
   intro:"The attackers tried to reach the servers using stolen passwords. Lock the accounts down.",
   lesson:"Length beats clever symbols. Use a password manager to create a unique passphrase for every account, turn on MFA, and treat an MFA prompt you didn't start as an alarm.",
   puzzles:[
   { type:"order", prompt:"Rank these passwords from weakest (1) to strongest (4).",
     hint:"Attackers try common words, years, and letter swaps such as 0 for o first. Length makes guessing much harder.",
     items:["admin","Welcome2026","W3lc0me2026!","cactus-umbrella-orbit-violin-42"],

async function gasCall(fn, arg){
  if(GAS_NATIVE) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg));
  if(!API_ON) throw new Error("not_configured");
  const r = await fetch(SCORES_API, {method:"POST", body: JSON.stringify({action:fn, game:GAME_ID, arg})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||"failed");
  return j.data;
}

let actx = null;
function beep(kind){
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {ok:[[660,.08],[880,.12]], no:[[220,.18]], win:[[523,.1],[659,.1],[784,.1],[1047,.25]], click:[[500,.03]]}[kind]||[];
    let t = actx.currentTime;
    seq.forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type = kind==="no"?"square":"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d; });
  }catch(e){}
}

  const pts = Math.max(20, 100 - 25*st.m - (st.h?30:0));
  st.pts = pts; S.score += pts;
  const R = S.rooms[r.id]; R.pts += pts; R.n++; if(st.m===0 && !st.h) R.clean++;
  beep("ok"); hud();
}

}

function vaultKey(k){
  if(k==="del"){ S.codeTry=S.codeTry.slice(0,-1); }
  else if(k==="ok"){
    if(S.codeTry.length<4) return toast("Enter all four digits.");
    if(S.codeTry===VAULT_CODE){ S.score+=100; S.rooms.vault.pts+=100; finish(); return; }
    S.rooms.vault.m++; S.score=Math.max(0,S.score-25); beep("no");
    S.codeTry=""; renderVault();
    const pz=$("#pz"); if(pz&&!reduced) pz.classList.add("shake");
    $("#fb").innerHTML = `<div class="fb no"><b>Access denied.</b>Match each light's colour to the room with that colour, then enter that room's digit.</div>`;
    hud(); return;
  }
  else if(S.codeTry.length<4){ S.codeTry+=k; beep("click"); }
  renderVault();
}
document.addEventListener("keydown", e => {
  if(tab!=="play" || screen!=="vault" || e.target.closest("button,input")) return;
  if(/^[0-9]$/.test(e.key)) vaultKey(e.key);
  else if(e.key==="Backspace") vaultKey("del");
  else if(e.key==="Enter") { e.preventDefault(); vaultKey("ok"); }
});

/* ----- Finish & results ----- */
function startClock(){ clearInterval(timerId); timerId=setInterval(hud, 1000); }
async function finish(){
  clearInterval(timerId); clearInterval(ltTimer);
  const sec = Math.round(elapsed());
  S.rooms.vault.t = (Date.now()-S.roomStart)/1000;
  const base = S.score;
  const bonus = Math.max(0, 600 - Math.floor(sec/2));
  const total = base + bonus;
  const mistakes = ALL_IDS.reduce((a,id)=>a+S.rooms[id].m,0);
  const hints = ALL_IDS.reduce((a,id)=>a+S.rooms[id].h,0);
  const rooms = {}; ALL_IDS.forEach(id => { const R=S.rooms[id]; rooms[id] = {m:R.m, h:R.h, pts:R.pts, clean:R.clean, n:R.n, t:Math.round(R.t)}; });
  const run = { score:total, base, bonus, time:sec, mistakes, hints, rooms, at:new Date().toISOString() };
  lastResult = { run, saved:false, saveMsg: canSave() ? "Saving your score…" : "Your score wasn't saved because the leaderboard isn't available in this view." };
  screen="results"; S=null; render(); beep("win"); confetti();
  if(GAS && player){
    try{
      const r = await gasCall("saveRun", {name:player.name, email:player.email, org:player.org||"", run});
      lastResult.saved = true;
      lastResult.saveMsg = r.isBest ? (r.plays>1 ? "New personal best saved to the leaderboard." : "Score saved to the leaderboard.") : `Saved. Your best of ${r.best} still stands.`;
    }catch(e){ lastResult.saveMsg = "Your score couldn't be saved. Check your connection and play again to retry."; }
    await loadBoardGas();
    if(tab==="play" && screen==="results") render();
    return;
  }
  if(cap.db && cap.uid){
    try{
      const ref = cap.db.doc("scores/"+cap.uid);
      const prev = (await ref.get()).data() || null;
      const better = !prev || total > (prev.best||0);
      const body = {
        best: better ? total : prev.best,
        bestTime: better ? sec : prev.bestTime,
        bestRun: better ? run : prev.bestRun,
        attempts: (prev?.attempts||0) + 1,
        firstAt: prev?.firstAt || run.at,
        lastAt: run.at,
        lastScore: total,
        runs: [ ...(prev?.runs||[]), run ].slice(-10)
      };
      await ref.set(body);
      lastResult.saved = true;
      lastResult.saveMsg = better ? (prev ? "New personal best saved to the leaderboard." : "Score saved to the leaderboard.") : `Saved. Your best of ${prev.best} still stands.`;
    }catch(e){
      lastResult.saveMsg = e?.code==="invalid_argument" ? "Your score couldn't be saved: your access to this game is view-only. Ask the organiser for Contributor access." : e?.code==="quota_exceeded" ? "Your score couldn't be saved because the leaderboard is full. Tell the organiser." : "Your score couldn't be saved. Check your connection and play again to retry.";
    }
    if(tab==="play" && screen==="results") render();
  }
}

  const ps = GAS ? {} : await profilesFor(ids);
  if(tab!=="board") return;
  lb.innerHTML = `<div class="tablewrap"><table>
    <thead><tr><th>Rank</th><th>Player</th><th class="num">Best score</th><th class="num">Time</th><th class="num">Wrong</th><th class="num">Hints</th><th class="num">Plays</th></tr></thead>
    <tbody>${board.map((b,i)=>{ const p=ps[b.id]||{};
      return `<tr class="${b.isMe?"me":""}"><td><span class="medal" style="color:${["#F2B300","#8C96B8","#C7783A"][i]||"var(--muted)"}">${i+1}</span></td>
      <td><span class="who">${p.avatarUrl?`<img src="${esc(p.avatarUrl)}" alt="">`:""}<span data-name></span>${b.isMe?' <span class="small muted">(you)</span>':""}</span></td>
      <td class="num"><b>${b.best??"–"}</b></td><td class="num">${fmt(b.bestTime||0)}</td><td class="num">${b.mistakes??"–"}</td><td class="num">${b.hints??"–"}</td><td class="num">${b.attempts||1}</td></tr>`;}).join("")}</tbody></table></div>`;
  lb.querySelectorAll("[data-name]").forEach((el,i)=>{ el.textContent = board[i].name || (ps[board[i].id]||{}).name || "Colleague"; });
}

/* =========================== ORGANISER RESULTS =========================== */
async function renderAdmin(){
  if(!cap.isOwner){ setTab("play"); return; }
  stage.innerHTML = `<div class="panel"><div class="eyebrow">Only you can see this tab</div>
    <h2 style="font-family:var(--display);font-weight:400;font-size:26px;margin:6px 0 4px">Team results</h2>
    <p class="muted small" style="margin:0 0 16px">Wrong attempts per play show which topics need more training. Figures update live as colleagues finish.</p>
    <div id="ad"></div></div>`;
  const ad = $("#ad");
  if(!board.length){ ad.innerHTML = `<div class="empty">No results yet. Share the game link with Contributor access, and results appear here as each colleague finishes.</div>`; return; }
  const runs = board.flatMap(b => (b.data.runs||[]));
  const players = board.length, plays = runs.length;
  const avg = Math.round(runs.reduce((a,r)=>a+r.score,0)/Math.max(1,plays));
  const avgT = runs.reduce((a,r)=>a+r.time,0)/Math.max(1,plays);
  const topic = [...ROOMS, VAULT].map(r => {
    const m = runs.reduce((a,x)=>a+(x.rooms?.[r.id]?.m||0),0)/Math.max(1,plays);
    const n = r.id==="vault" ? VAULT.questions.length : r.puzzles.length;
    const clean = runs.reduce((a,x)=>a+(x.rooms?.[r.id]?.clean||0),0)/Math.max(1,plays*n)*100;
    return {r, m, clean};
  });
  const maxM = Math.max(1, ...topic.map(t=>t.m));
  const ps = await profilesFor(board.map(b=>b.id));
  if(tab!=="admin") return;
  ad.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${players}</b><span>players</span></div>
      <div class="stat"><b>${plays}</b><span>completed plays</span></div>
      <div class="stat"><b>${avg}</b><span>average score</span></div>
      <div class="stat"><b>${fmt(avgT)}</b><span>average time</span></div>
    </div>
    <h3 style="margin:8px 0 10px">Average wrong attempts per play, by topic</h3>
    <div class="bars">${topic.map(t=>`<div class="barrow"><span>${esc(t.r.topic)}</span><span class="bartrack"><i style="width:${t.m/maxM*100}%;background:${t.r.color}"></i></span><span class="small" style="font-family:var(--mono);text-align:right">${t.m.toFixed(1)}</span></div>`).join("")}</div>
    <p class="small muted">First-time accuracy: ${topic.map(t=>`${esc(t.r.topic)} ${Math.round(t.clean)}%`).join(" · ")}</p>
    <div class="row" style="justify-content:space-between;margin:18px 0 10px"><h3>Every player</h3>${cap.downloads?`<button class="btn ghost" id="csv">Download results as CSV</button>`:""}</div>
    <div class="tablewrap"><table><thead><tr><th>Player</th><th class="num">Best</th><th class="num">Last</th><th class="num">Plays</th><th class="num">Best time</th>${ROOMS.map(r=>`<th class="num" title="${esc(r.topic)}">${esc(r.short)} wrong</th>`).join("")}<th>Last played</th></tr></thead>
    <tbody>${board.map(b=>{ const d=b.data, br=d.bestRun||{rooms:{}};
      return `<tr><td data-n="${esc(b.id)}"></td><td class="num"><b>${d.best}</b></td><td class="num">${d.lastScore??"–"}</td><td class="num">${d.attempts||1}</td><td class="num">${fmt(d.bestTime||0)}</td>${ROOMS.map(r=>`<td class="num">${br.rooms?.[r.id]?.m ?? "–"}</td>`).join("")}<td>${d.lastAt?new Date(d.lastAt).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}):"–"}</td></tr>`;}).join("")}</tbody></table></div>`;
  ad.querySelectorAll("[data-n]").forEach(el => { el.textContent = (ps[el.dataset.n]||{}).name || "Colleague"; });
  $("#csv")?.addEventListener("click", async () => {
    const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
    const head = ["Player","Best score","Best time (s)","Last score","Plays","Best-run wrong attempts","Best-run hints",...ROOMS.map(r=>r.topic+" wrong"),"Lightning correct","First played","Last played"];
    const rows = board.map(b=>{ const d=b.data, br=d.bestRun||{rooms:{}};
      return [(ps[b.id]||{}).name||"Colleague", d.best, d.bestTime, d.lastScore, d.attempts, br.mistakes, br.hints, ...ROOMS.map(r=>br.rooms?.[r.id]?.m), br.rooms?.vault?.clean, d.firstAt, d.lastAt].map(q).join(","); });
    try{ await cap.downloads.save({filename:"cyber-escape-room-results.csv", data:[head.map(q).join(","),...rows].join("\n")}); }
    catch(e){ toast("The download didn't complete."); }
  });
}

/* =========================== CONFETTI =========================== */
function confetti(){
  if(reduced) return;
  const c=$("#confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#FF5E3A","#0FA89A","#F2B300","#7650F0","#2456E8"];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6+4,a:Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
  let f=0; (function step(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore();}); if(++f<220) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); })();
}

/* =========================== BOOT =========================== */
render();
if(GAS){ cap.ready = true; loadBoardGas(); }
else (async () => {
  const use = n => window.claude?.use ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db, user, downloads] = await Promise.all([use("db"), use("user"), use("downloads")]);
  cap.db = db; cap.user = user; cap.downloads = downloads; cap.ready = true;
  if(user){ try{ cap.uid = await user.id(); cap.isOwner = await user.isOwner(); }catch(e){} }
  if(!cap.uid) cap.db = null;
  $("#tab-admin").hidden = !cap.isOwner;
  if(cap.db){
    cap.db.collection("scores").orderBy("best","desc").limit(200).onSnapshot(snap => {
      board = snap.docs.filter(d=>d.exists).map(d=>{ const x=d.data(), br=x.bestRun||{};
        return {id:d.id, data:x, best:x.best, bestTime:x.bestTime, mistakes:br.mistakes, hints:br.hints, attempts:x.attempts, isMe:d.id===cap.uid}; });
      if(tab!=="play" || screen==="intro" || screen==="results") render();
    }, () => {});
  }
  if(tab!=="play" || screen==="intro") render();
})();
</script>
